name: check

# 这条流水线只做一件事：push / PR 跑**与本地完全相同**的那条命令，不额外加步骤。
#
# 口径（与 npm run check 一致，勿在此增删）：
#   - 两路矩阵：windows-latest（开发机口径：.bat、路径分隔符、发版装配都在这一路测）
#     与 ubuntu-latest（Linux 口径：给拿仓库做研究 / 训练 / 二次开发的人一个可复现入口）。
#     两路跑的是同一条 `npm run check`，不为迁就某个平台删步骤或改用例。
#   - 用 node 22：与 package.json 依赖（Vite 8 / Vitest 4）和本机版本对齐。
#   - **不跑** tests/flows/ai-selfplay.test.ts（test:fast 已排除：单轮 4–5 分钟，
#     且剧本 1 第 9 回合有既有红灯，见 docs/开发文档.md §7.3）。
#   - 不跑 pack / 安卓构建：发布与签名依赖本机密钥，不入 CI。
#
# 平台依赖为什么删掉了 `@rolldown/binding-win32-x64-msvc`：
#   它曾被写成 package.json 的**直依赖**，于是 Linux 上 `npm ci` 直接
#   `EBADPLATFORM`（wanted os=win32）。rolldown 自己已把各平台 binding 声明为
#   optionalDependencies（Linux 上会自动装 binding-linux-x64-gnu），该直依赖多余，
#   2026-11-25 删除；删除后 Windows 与 Linux 的 `npm ci` 均实测通过。

on:
  push:
    branches: [refactor/workbench-decouple, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 门禁（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖（按 lockfile）
        run: npm ci

      - name: 门禁（lint / format / typecheck / 审计 / TDZ / 计数器 / test:fast / 架构）
        run: npm run check
