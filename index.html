<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      触摸屏端（安卓 WebView）：
        · `viewport-fit=cover` ⇒ 内容可铺到刘海/圆角外，再由安全区 `env(safe-area-inset-*)` 让开；
        · `maximum-scale=1 / user-scalable=no` ⇒ 禁掉页面级双指缩放（否则两指捏地图会缩放整个页面，
          地图自己的捏合完全失效）；地图与面板内部各自实现需要的缩放。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- 移动端状态栏配色：与命令台底色一致，避免白条割裂 -->
    <meta name="theme-color" content="#f2efe7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23201e1a'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23f6f4ee'%3E%E8%87%A3%3C/text%3E%3C/svg%3E"
    />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
