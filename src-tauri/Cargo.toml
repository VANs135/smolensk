[package]
name = "smolensk-ocs"
version = "0.1.0"
description = "OCS 斯摩棱斯克电子裁判台"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
